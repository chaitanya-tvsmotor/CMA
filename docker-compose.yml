services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cma-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cma-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1" -C || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 3s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cma-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CMADb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Key=YourSuperSecretKeyForJwtTokenGeneration123456789
      - Jwt__Issuer=CMA
      - Jwt__Audience=CMA
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cma-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cma-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - cma-network
    restart: unless-stopped

networks:
  cma-network:
    driver: bridge

volumes:
  sqlserver-data:
